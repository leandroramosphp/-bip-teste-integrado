<div class="container">

  <!-- HEADER -->
  <h1 class="title">💰 Benefícios</h1>

  <!-- TABELA -->
  <mat-card class="card">
    <mat-card-title>Lista de Benefícios</mat-card-title>

    <table mat-table [dataSource]="beneficios" class="mat-elevation-z2">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let b">{{ b.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let b">{{ b.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="valor">
        <th mat-header-cell *matHeaderCellDef>Valor</th>
        <td mat-cell *matCellDef="let b">
          {{ b.valor | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['id','nome','valor']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['id','nome','valor']"></tr>

    </table>
  </mat-card>
